server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}

exchange:
  api:
    auth-key: ${EXCHANGE_API_KEY}
    base-url: https://oapi.koreaexim.go.kr/site/program/financial/exchangeJSON
  cors:
    frontend-url: ${FRONTEND_URL:http://localhost}

frontend:
  url: ${FRONTEND_URL:http://localhost}
